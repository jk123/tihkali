[package]
name = "tihkali-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["qemu-virt", "net"]
qemu-virt = []
rpi3 = []
net = ["dep:smoltcp"]

[[bin]]
name = "tihkali"
path = "src/main.rs"

[dependencies]
managed = { version = "0.8", default-features = false }
smoltcp = { version = "0.12", default-features = false, optional = true, features = [
    "medium-ethernet",
    "proto-ipv4",
    "socket-icmp",
    "socket-udp",
    "socket-tcp",
    "socket-dhcpv4",
    "socket-dns",
] }
